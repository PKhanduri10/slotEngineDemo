name: Basic Slot Demo
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      # Test step removed since logic is directly inside main.ts

      - name: Build Game Production Package
        run: npm run build

      - name: Setup GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/'

    deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    # Required permissions for GitHub Pages OIDC deployment
    permissions:
      pages: write      # Pages deployment permission
      id-token: write   # OIDC token permission for GitHub Pages authentication
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ... aapke build / artifact upload steps ...

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4