<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slot Game Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #121212;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: relative;
            overflow: hidden;
        }
        #game-container canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #loading-screen {
            position: absolute;
            inset: 0;
            z-index: 1;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            color: #fff;
            background: #1a1a2e;
            font: 600 20px Arial, sans-serif;
        }
        #loading-bar-track {
            width: min(360px, 70%);
            height: 14px;
            overflow: hidden;
            border: 1px solid #7272a8;
            border-radius: 999px;
            background: #292944;
        }
        #loading-bar {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #7c4dff, #00d4ff);
            transition: width 120ms ease-out;
        }
        #loading-progress {
            color: #c8c8e8;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="loading-screen" role="status" aria-live="polite">
            <div id="loading-message">Loading game...</div>
            <div id="loading-bar-track" role="progressbar" aria-label="Game loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div id="loading-bar"></div>
            </div>
            <div id="loading-progress">0%</div>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
